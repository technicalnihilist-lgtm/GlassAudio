// Gradle path (Android Studio). ./build.sh is the tested, dependency-free build.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.glassaudio.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.glassaudio.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Non-standard layout: sources live directly under app/
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
